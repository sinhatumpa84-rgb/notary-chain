version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: notary_postgres
    environment:
      POSTGRES_USER: notary_user
      POSTGRES_PASSWORD: notary_pass_dev
      POSTGRES_DB: notary_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - notary_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notary_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: notary_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - notary_network
    command: redis-server --appendonly yes --requirepass redis_pass_dev
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: notary_minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_pass_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - notary_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notary_backend
    environment:
      DATABASE_URL: postgresql://notary_user:notary_pass_dev@postgres:5432/notary_db
      REDIS_URL: redis://:redis_pass_dev@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio_admin
      S3_SECRET_KEY: minio_pass_dev
      JWT_SECRET_KEY: dev_jwt_secret_change_in_production
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    networks:
      - notary_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker (Background tasks)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notary_celery_worker
    environment:
      DATABASE_URL: postgresql://notary_user:notary_pass_dev@postgres:5432/notary_db
      REDIS_URL: redis://:redis_pass_dev@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio_admin
      S3_SECRET_KEY: minio_pass_dev
      CELERY_BROKER_URL: redis://:redis_pass_dev@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redis_pass_dev@redis:6379/2
    volumes:
      - ./backend:/app
    networks:
      - notary_network
    depends_on:
      - redis
      - postgres
    command: celery -A app.celery_app worker --loglevel=info

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notary_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - notary_network
    depends_on:
      - backend
    command: npm run dev

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: notary_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - notary_network
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:

networks:
  notary_network:
    driver: bridge
